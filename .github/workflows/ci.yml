name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            build_args: --bundles msi
            artifact_name: codey-windows-x64
            artifact_path: src-tauri/target/release/bundle/msi/*.msi
            apple_signing_identity: ""
          - name: macOS
            os: macos-15
            build_args: --bundles dmg
            artifact_name: codey-macos-arm64
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
            apple_signing_identity: "-"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

      - name: Typecheck
        run: yarn check:ci

      - name: Test typecheck gate
        run: node --test scripts/check-type-baseline.test.mjs scripts/verify-release.test.mjs

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build desktop artifact
        env:
          CI: true
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        run: yarn tauri build ${{ matrix.build_args }}

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
