name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: codey-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every matrix leg uploads to the same GitHub Release. Serializing the
      # legs avoids a race while the first leg creates that release.
      max-parallel: 1
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles msi
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x64
          - name: macOS arm64
            os: macos-15
            args: --target aarch64-apple-darwin --bundles app,dmg
            target: aarch64-apple-darwin
            asset_suffix: macos-arm64
          - name: macOS x64
            os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
            target: x86_64-apple-darwin
            asset_suffix: macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify release inputs and typecheck
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is required."; exit 1; }
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error("Release tag must match package.json version");
            }
          '
          yarn check:ci
          node --test scripts/check-type-baseline.test.mjs scripts/verify-release.test.mjs

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "Codey macOS releases require APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi

          has_api_credentials=false
          if [[ -n "$APPLE_API_KEY" || -n "$APPLE_API_ISSUER" || -n "$APPLE_API_KEY_P8" ]]; then
            has_api_credentials=true
            if [[ -z "$APPLE_API_KEY" || -z "$APPLE_API_ISSUER" || -z "$APPLE_API_KEY_P8" ]]; then
              echo "APPLE_API_KEY, APPLE_API_ISSUER, and APPLE_API_KEY_P8 must be configured together."
              exit 1
            fi
            api_key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
            chmod 600 "$api_key_path"
            {
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY_PATH=$api_key_path"
            } >> "$GITHUB_ENV"
          fi

          has_apple_id_credentials=false
          if [[ -n "$APPLE_ID" || -n "$APPLE_PASSWORD" ]]; then
            has_apple_id_credentials=true
          fi

          if [[ "$has_api_credentials" == true && "$has_apple_id_credentials" == true ]]; then
            echo "Configure either App Store Connect API key credentials or Apple ID credentials, not both."
            exit 1
          fi

          if [[ "$has_api_credentials" == false && ( "$has_apple_id_credentials" == true || -n "$APPLE_TEAM_ID" ) ]]; then
            if [[ -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
              echo "APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID must be configured together."
              exit 1
            fi
          fi

          if [[ "$has_api_credentials" == false && "$has_apple_id_credentials" == false ]]; then
            echo "Configure either APPLE_API_KEY/APPLE_API_ISSUER/APPLE_API_KEY_P8 or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID."
            exit 1
          fi

          if [[ "$has_api_credentials" == false ]]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          fi

          # Tauri infers the identity from the certificate when this is omitted.
          if [[ -n "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi

          if [[ -n "$APPLE_PROVIDER_SHORT_NAME" ]]; then
            echo "APPLE_PROVIDER_SHORT_NAME=$APPLE_PROVIDER_SHORT_NAME" >> "$GITHUB_ENV"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: yarn tauri
          tagName: ${{ github.event_name == 'push' && github.ref_name || 'v__VERSION__' }}
          releaseName: Codey ${{ github.event_name == 'push' && github.ref_name || 'v__VERSION__' }}
          generateReleaseNotes: true
          releaseBody: |
            Windows: download the .msi installer. macOS: download the .dmg for your Mac.
            Updates are downloaded in the app and installed when you choose to restart.
            Versions 0.0.49 and earlier need one manual installation to enable in-app updates.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          uploadPlainBinary: false
          releaseAssetNamePattern: "codey-v[version]-${{ matrix.asset_suffix }}-[bundle][ext]"

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Target x86_64-pc-windows-msvc

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app="src-tauri/target/$BUILD_TARGET/release/bundle/macos/codey.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

  publish:
    name: Verify assets and publish release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Verify all updater platforms and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs
          release_tag="v$(node -p 'require("./package.json").version')"
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
