name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --no-bundle
            upload_plain_binary: true
            asset_suffix: windows-x64
          - name: macOS arm64
            os: macos-14
            args: ""
            upload_plain_binary: false
            asset_suffix: macos-arm64
          - name: macOS x64
            os: macos-15-intel
            args: ""
            upload_plain_binary: false
            asset_suffix: macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Codey v__VERSION__
          releaseBody: Automated GitHub release for Codey.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          uploadPlainBinary: ${{ matrix.upload_plain_binary }}
          releaseAssetNamePattern: "codey-v[version]-${{ matrix.asset_suffix }}-[bundle][ext]"
