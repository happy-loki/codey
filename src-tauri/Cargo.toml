[package]
name = "arthas"
version = "0.0.49"
description = "A Tauri App"
authors = ["Arthas Team"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }
# Note: tonic-build and protoc removed - was for Cline gRPC

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9.2", features = ["protocol-asset"] }
tauri-plugin-fs = { version = "2.4.2", features = ["watch"] }
trash = "3.0.2"
tauri-plugin-store = { version = "2.4.0" }
encoding_rs = "0.8.32"
chardetng = "0.1"
tauri-plugin-log = { version = "2.4.0" }
tauri-plugin-opener = "2"
time = "0.3.28"
log = "^0.4"
infer = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "process", "io-util"] }
tauri-plugin-process = "2.3.0"
tauri-plugin-shell = "2.3.1"
tauri-plugin-pty = "0.1.1"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-clipboard-manager = "2.3.0"
notify = { version = "6" }
font-kit = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
urlencoding = "2.1.3"
thiserror = "1"
mime_guess = "2.0"
futures-util = "0.3"
rustls = { version = "0.23", features = ["ring"] }
tokio-stream = "0.1"
http = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
ignore = "0.4"
toml = "0.8"
toml_edit = "0.22"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
blake3 = "1.5"
base64 = "0.22"
regex = "1.11"
url = "2.5"
percent-encoding = "2.3"
resvg = "0.45"
gif = "0.13"

anyhow = "1"
uuid = { version = "1", features = ["serde", "v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"
path-clean = "1.0"
once_cell = "1"

[dev-dependencies]
tempfile = "3.24.0"



[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
devtools = ["tauri/devtools"]
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }


[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = "0.32.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
