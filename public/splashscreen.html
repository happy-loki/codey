<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Codey Loading</title>
        
        <style>
            :root {
                /* 声明支持双主题 */
                color-scheme: light dark;

                /* 品牌色（降饱和、略偏柔） */
                --brand-h: 215;
                --brand-s: 60%;
                --brand-l: 56%;
                --brand: hsl(var(--brand-h) var(--brand-s) var(--brand-l));

                /* 默认按系统偏好（浅色） */
                --bg: #f7f8fa;
                --bg-grad-1: #ffffff;
                --bg-grad-2: #f1f3f6;

                --text: #0c0e12;
                --muted: #6b7280;

                --ring-track: #e6e8eb;
                --ring-active: var(--brand);

                --logo-shadow: 0 10px 26px rgba(20, 22, 25, 0.18);
                --gloss-alpha: 0.12;
            }

            

            /* 应用可通过设置 data-theme 强制覆盖 */
            

            

            html {
                width: 100%;
                height: 100%;
                background-color: var(--bg);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                width: 100vw;
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

                /* 柔和中性渐变，light/dark 变量自适应 */
                background-color: var(--bg);
                background-image: radial-gradient(
                    1200px 600px at 50% -10%,
                    var(--bg-grad-1) 0%,
                    var(--bg) 55%,
                    var(--bg-grad-2) 100%
                );
                color: var(--text);
            }

            .logo-circle {
                width: 96px;
                height: 96px;
                border-radius: 50%;
                /* 降饱和的紫色双停靠渐变，避免“发亮” */
                background: linear-gradient(
                    135deg,
                    hsl(var(--brand-h) var(--brand-s) calc(var(--brand-l) + 3%)) 0%,
                    hsl(calc(var(--brand-h) + 10) calc(var(--brand-s) - 8%) calc(var(--brand-l) + 1%)) 100%
                );
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: var(--logo-shadow);
                position: relative;
                overflow: hidden;
            }

            .logo-circle::after {
                content: "";
                position: absolute;
                inset: 0;
                /* 轻微高光，控制在很低的透明度，避免刺眼 */
                background: linear-gradient(120deg, rgba(255, 255, 255, var(--gloss-alpha)), rgba(255, 255, 255, 0));
                pointer-events: none;
            }

            .logo-icon {
                display: inline-flex;
                width: 58px;
                height: 58px;
                color: #ffffff; /* 让 SVG 使用白色作为 currentColor，蓝底上对比清晰 */
            }

            h1 {
                margin: 0;
                font-size: 20px;
                font-weight: 600;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            p {
                margin: 0;
                color: var(--muted);
                font-size: 13px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .spinner {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                border: 3px solid var(--ring-track);
                border-top-color: var(--ring-active);
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                from { transform: rotate(0turn); }
                to { transform: rotate(1turn); }
            }
        </style>
    </head>
    <body>
        <div class="logo-circle">
            <span class="logo-icon" aria-hidden="true">
                <!-- 内联 cline_icon.svg，填充/描边改为 currentColor，随 CSS 控制颜色 -->
                <svg viewBox="0 0 92 96" xmlns="http://www.w3.org/2000/svg" width="58" height="58">
                    <g fill="none" fill-rule="evenodd" stroke="none" stroke-width="1">
                        <g transform="translate(-34, -40)" fill="currentColor" stroke="currentColor">
                            <g transform="translate(34, 40.5)">
                                <g transform="translate(0, 0)">

                                    <circle cx="45.7349843" cy="11" r="11"></circle>
                                </g>
                                <rect x="31" y="44.5" width="5" height="22" rx="2.5" stroke-width="8"></rect>
                                <rect x="55" y="44.5" width="5" height="22" rx="2.5" stroke-width="8"></rect>
                            </g>
                        </g>
                    </g>
                </svg>
            </span>
        </div>
        <h1>Codey</h1>
        <p>Preparing workspace…</p>
        <div class="spinner" aria-hidden="true"></div>
    </body>
</html>
